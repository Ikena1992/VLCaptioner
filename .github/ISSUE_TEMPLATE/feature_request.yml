name: Feature request
description: Propose an improvement to VLCaptioner.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to accomplish, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome and any alternatives you considered.
    validations:
      required: true
